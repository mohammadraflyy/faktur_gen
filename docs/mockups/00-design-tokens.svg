<svg xmlns="http://www.w3.org/2000/svg" width="820" height="880" viewBox="0 0 820 880" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="820" height="880" fill="#FFFFFF"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="#111827">Faktura: sistem desain minimalis</text>
  <text x="40" y="82" font-size="14" fill="#6B7280">Putih, jarak, dan teks membawa hierarki. Warna hanya untuk aksi dan status.</text>

  <text x="40" y="136" font-size="15" font-weight="600" fill="#111827">Warna</text>
  <g font-size="12" fill="#374151">
    <circle cx="56" cy="172" r="16" fill="#2563EB"/><text x="84" y="168" fill="#111827" font-weight="600">Aksen #2563EB</text><text x="84" y="184">tombol utama, tab aktif, tautan</text>
    <circle cx="296" cy="172" r="16" fill="#047857"/><text x="324" y="168" fill="#111827" font-weight="600">Struk #047857</text><text x="324" y="184">tombol struk saja</text>
    <circle cx="536" cy="172" r="16" fill="#111827"/><text x="564" y="168" fill="#111827" font-weight="600">Teks #111827</text><text x="564" y="184">sekunder #6B7280</text>
    <circle cx="56" cy="228" r="16" fill="#FFFFFF" stroke="#E5E7EB"/><text x="84" y="224" fill="#111827" font-weight="600">Latar #FFFFFF</text><text x="84" y="240">tanpa kartu abu</text>
    <circle cx="296" cy="228" r="16" fill="#F3F4F6"/><text x="324" y="224" fill="#111827" font-weight="600">Field #F3F4F6</text><text x="324" y="240">placeholder #4B5563</text>
    <circle cx="536" cy="228" r="16" fill="#FFFFFF" stroke="#F0F1F3" stroke-width="4"/><text x="564" y="224" fill="#111827" font-weight="600">Garis #F0F1F3</text><text x="564" y="240">pemisah 1px</text>
  </g>

  <text x="40" y="300" font-size="15" font-weight="600" fill="#111827">Status: teks berwarna + titik, tanpa blok latar</text>
  <g font-size="14" font-weight="600">
    <circle cx="46" cy="331" r="4" fill="#B91C1C"/><text x="58" y="336" fill="#B91C1C">Lewat 5 hari</text>
    <circle cx="186" cy="331" r="4" fill="#B45309"/><text x="198" y="336" fill="#B45309">Belum dibayar</text>
    <circle cx="336" cy="331" r="4" fill="#047857"/><text x="348" y="336" fill="#047857">Lunas</text>
  </g>
  <text x="430" y="336" font-size="12" fill="#6B7280">6.47 · 5.02 · 5.48 : 1 di putih</text>

  <text x="40" y="396" font-size="15" font-weight="600" fill="#111827">Mode gelap</text>
  <rect x="40" y="410" width="520" height="88" rx="14" fill="#0F1117"/>
  <rect x="56" y="430" width="140" height="48" rx="12" fill="#60A5FA"/><text x="126" y="459" text-anchor="middle" font-size="14" font-weight="600" fill="#0F1117">Buat PDF</text>
  <text x="216" y="450" font-size="14" fill="#F3F4F6">Teks utama #F3F4F6</text>
  <text x="216" y="472" font-size="13" fill="#9CA3AF">Sekunder #9CA3AF · tautan #93C5FD</text>

  <text x="40" y="550" font-size="15" font-weight="600" fill="#111827">Teks: 6 ukuran, semua lewat textTheme</text>
  <g fill="#111827">
    <text x="40" y="592" font-size="32" font-weight="700">Rp 12.450.000</text><text x="360" y="592" font-size="12" fill="#6B7280">32/700 angka utama</text>
    <text x="40" y="628" font-size="22" font-weight="700">Judul halaman</text><text x="360" y="628" font-size="12" fill="#6B7280">22/700</text>
    <text x="40" y="660" font-size="17" font-weight="600">Judul bagian</text><text x="360" y="660" font-size="12" fill="#6B7280">17/600, bukan HURUF BESAR</text>
    <text x="40" y="690" font-size="15">Isi dan field</text><text x="360" y="690" font-size="12" fill="#6B7280">15/400</text>
    <text x="40" y="716" font-size="13" fill="#6B7280">Keterangan</text><text x="360" y="716" font-size="12" fill="#6B7280">13/400</text>
    <text x="40" y="740" font-size="12" font-weight="600">Label nav</text><text x="360" y="740" font-size="12" fill="#6B7280">12/600 minimum</text>
  </g>

  <text x="40" y="792" font-size="15" font-weight="600" fill="#111827">Tombol: satu utama per layar</text>
  <rect x="40" y="806" width="150" height="48" rx="12" fill="#2563EB"/><text x="115" y="835" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Utama</text>
  <rect x="202" y="806" width="150" height="48" rx="12" fill="#EFF6FF"/><text x="277" y="835" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">Sekunder</text>
  <text x="380" y="835" font-size="14" font-weight="600" fill="#2563EB">Teks</text>
  <text x="450" y="835" font-size="12" fill="#6B7280">radius 12 tombol/field, 20 sheet · sentuh ≥ 48dp</text>
</svg>
