  <g font-size="13" fill="#111827">
    <text x="440" y="60" font-size="18" font-weight="700">02 · Invoice baru (pola A)</text>
    <text x="440" y="84" fill="#374151">Satu halaman, dibaca seperti invoice-nya sendiri.</text>
    <text x="440" y="124" font-weight="600">Isi lebih dulu, form belakangan</text>
    <text x="440" y="144" fill="#374151">Klien, tanggal, pajak tampil sebagai teks;</text>
    <text x="440" y="162" fill="#374151">tap baris membuka sheet untuk mengubah.</text>
    <text x="440" y="202" font-weight="600">Item = baris teks</text>
    <text x="440" y="222" fill="#374151">Tap untuk edit, geser untuk hapus + Urungkan.</text>
    <text x="440" y="240" fill="#374151">Dulu 5 field dan 3 ikon kecil per item.</text>
    <text x="440" y="280" font-weight="600">Jatuh tempo: chip cepat</text>
    <text x="440" y="300" fill="#374151">7/14/30 hari; tanggal lain lewat tap teks.</text>
    <text x="440" y="340" font-weight="600">Total menempel di bawah</text>
    <text x="440" y="360" fill="#374151">Satu tombol utama di layar: Buat PDF.</text>
    <text x="440" y="400" font-weight="600">Smooth</text>
    <text x="440" y="420" fill="#374151">Ketik qty/harga hanya membangun ulang</text>
    <text x="440" y="438" fill="#374151">baris itu dan total (ValueListenableBuilder),</text>
    <text x="440" y="456" fill="#374151">bukan seluruh halaman lewat setState.</text>
    <text x="440" y="474" fill="#374151">Total berganti dengan fade 150ms.</text>
    <text x="440" y="840" font-size="12" fill="#6B7280">Nama dan angka: data contoh.</text>
