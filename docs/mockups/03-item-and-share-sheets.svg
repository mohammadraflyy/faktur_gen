  <g font-size="13" fill="#374151">
    <text x="20" y="956" font-weight="600" fill="#111827">Edit item</text>
    <text x="20" y="976">Field terisi abu tanpa garis; label di atas. Subtotal masuk ke tombol</text>
    <text x="20" y="994">Simpan, satu baris lebih sedikit. Sheet naik 250ms, bisa ditarik turun.</text>
    <text x="20" y="1012">Keyboard tidak menutup field (sheet ikut naik).</text>
    <text x="450" y="956" font-weight="600" fill="#111827">Setelah PDF jadi</text>
    <text x="450" y="976">Centang muncul dengan scale 0.8→1 (200ms) + haptic ringan.</text>
    <text x="450" y="994">Aksi pakai showPdfActionSheet yang sudah ada. Pengingat = toggle.</text>
    <text x="450" y="1012">"Selesai" menutup satu layar (bug sekarang: dua).</text>
